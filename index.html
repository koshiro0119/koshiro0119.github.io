<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="物語ノートは、本や登場人物、関係、記録・メモを整理するAndroidアプリです。">
  <title>物語ノート</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f1e8; --paper: #fffdf8; --text: #24281f; --accent: #426333; --line: #d9ddcf; }
    @media (prefers-color-scheme: dark) { :root { --bg: #191916; --paper: #24241f; --text: #e3e5da; --accent: #aed18f; --line: #444b3e; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.9 system-ui, "Yu Gothic", Meiryo, sans-serif; overflow-wrap: anywhere; }
    main { max-width: 640px; margin: 48px auto; padding: 32px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; }
    h1 { margin-top: 0; font-size: 28px; }
    h2 { margin-top: 28px; font-size: 18px; }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    @media (max-width: 480px) { body { padding: 16px; } main { margin: 16px auto; padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <h1>物語ノート</h1>
    <p>本や登場人物、人物同士の関係、読書の記録・メモを整理するAndroidアプリです。</p>
    <p>登録した内容は端末内に保存します。広告に関する情報の取り扱いを含め、詳しくはプライバシーポリシーをご覧ください。</p>
    <p><a href="https://koshiro0119.github.io/novel-note-privacy/">プライバシーポリシー</a></p>
    <h2>お問い合わせ</h2>
    <p><a href="mailto:roucangquan@gmail.com">roucangquan@gmail.com</a></p>
  </main>
</body>
</html>
